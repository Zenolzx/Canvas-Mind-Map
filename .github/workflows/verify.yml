name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser suites are the only checks that exercise real SVG rendering and export, so
      # CMM_REQUIRE_BROWSER makes a missing browser a failure here rather than a skip.
      - name: Install Chromium for the browser suites
        run: npx playwright install --with-deps chromium

      - name: Type check and lint
        run: |
          npx tsc -noEmit -skipLibCheck
          npm run lint

      - name: Unit checks
        run: npm run test:unit

      # Committed screenshot baselines are recorded on Windows and are not portable: glyph
      # rasterisation and font fallback differ per OS, and the fixtures ask for Arial, so the
      # same code produces a different image here. The visual layer reports a loud SKIP for those
      # baselines instead of a false regression (see scripts/lib/visual.cjs). Every behavioural
      # browser assertion still runs, as do the property-level guards — render contract, design
      # tokens, export and layout composition — which do not depend on the host.
      - name: Browser checks
        run: npm run test:browser
        env:
          CMM_REQUIRE_BROWSER: '1'

      - name: Production build
        run: npm run build
